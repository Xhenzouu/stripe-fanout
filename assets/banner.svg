<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FanOut banner: one webhook fanning out to three parallel branches, then an audit log">
  <rect width="1200" height="320" fill="#1a1918"/>
  <rect x="0" y="0" width="1200" height="4" fill="#6366f1"/>

  <text x="64" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#f5f3ef">FanOut</text>
  <text x="64" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#a8a29e">Stripe payment pipeline simulator:</text>
  <text x="64" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#a8a29e">parallel branches, partial-failure handling</text>

  <!-- connector lines -->
  <g stroke="#3a3836" stroke-width="2" fill="none">
    <line x1="760" y1="160" x2="830" y2="92"/>
    <line x1="760" y1="160" x2="830" y2="160"/>
    <line x1="760" y1="160" x2="830" y2="228"/>
    <line x1="960" y1="92" x2="1030" y2="160"/>
    <line x1="960" y1="160" x2="1030" y2="160"/>
    <line x1="960" y1="228" x2="1030" y2="160"/>
  </g>

  <!-- arrowheads -->
  <g fill="#6366f1">
    <polygon points="830,92 818,85 819,98"/>
    <polygon points="830,160 816,153 816,167"/>
    <polygon points="830,228 818,222 819,235"/>
    <polygon points="1030,160 1017,153 1017,167"/>
  </g>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="640" y="138" width="120" height="44" rx="8" fill="#262422" stroke="#6366f1" stroke-width="1.5"/>
    <text x="700" y="165" fill="#f5f3ef">Webhook</text>

    <rect x="830" y="72" width="130" height="40" rx="8" fill="#262422" stroke="#6366f1" stroke-width="1.5"/>
    <text x="895" y="97" fill="#f5f3ef">Slack</text>

    <rect x="830" y="140" width="130" height="40" rx="8" fill="#262422" stroke="#6366f1" stroke-width="1.5"/>
    <text x="895" y="165" fill="#f5f3ef">Airtable</text>

    <rect x="830" y="208" width="130" height="40" rx="8" fill="#262422" stroke="#6366f1" stroke-width="1.5"/>
    <text x="895" y="233" fill="#f5f3ef">Resend</text>

    <rect x="1030" y="138" width="120" height="44" rx="8" fill="#6366f1"/>
    <text x="1090" y="165" fill="#1a1918">Audit log</text>
  </g>
</svg>
